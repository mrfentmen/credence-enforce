[build-system]
# >=77 for PEP 639 `license` / `license-files` support.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Fork of credence-guard. `credence-guard` on PyPI belongs to the upstream
# author, so this fork publishes under its own name. See docs/FORK.md.
name = "credence-enforce"
version = "1.3.0"
description = "Credence — epistemic enforcement layer that prevents LLMs from forgetting what they didn't know (fork of credence-guard)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "Lakshmi-Chakradhar-Vijayarao", email = "vijayarao.l@northeastern.edu" },
    { name = "mrfentmen", email = "mrfentmen@users.noreply.github.com" },
]
keywords = [
    "llm", "claude", "epistemic", "uncertainty", "mcp",
    "agent", "context-compression", "hallucination", "safety",
    "claude-code", "eql", "false-certainty"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=1.0.0",
]

[project.optional-dependencies]
api = [
    "anthropic>=0.40.0",
]
demo = [
    "streamlit>=1.30.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "anthropic>=0.40.0",
]

[project.scripts]
credence              = "credence.__main__:main"
credence-server       = "credence.mcp_server:main"
credence-install-gate = "credence.install_gate:main"

[project.urls]
# Fork repository — create it before publishing (docs/FORK.md, step 1).
Homepage = "https://github.com/mrfentmen/credence-enforce"
Repository = "https://github.com/mrfentmen/credence-enforce"
"Bug Tracker" = "https://github.com/mrfentmen/credence-enforce/issues"
"Source (fork)" = "https://github.com/mrfentmen/credence-enforce"
"PyPI" = "https://pypi.org/project/credence-enforce/"
# Upstream attribution (Apache 2.0 — see NOTICE).
"Upstream (credence-ai)" = "https://github.com/Lakshmi-Chakradhar-Vijayarao/credence-ai"
"Upstream (credence-guard on PyPI)" = "https://pypi.org/project/credence-guard/"
Documentation = "https://github.com/mrfentmen/credence-enforce/blob/main/docs/TECHNICAL_REPORT.md"

[tool.setuptools.packages.find]
include = ["credence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
